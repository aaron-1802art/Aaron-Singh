<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Graph Paper Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(190, 70, 200, 0.28)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Paper & Grid -->
  <rect width="1200" height="630" fill="#F6F6F7"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Pixel Mosaic Decoration -->
  <g transform="translate(120, 110) rotate(-6)">
    <rect width="90" height="70" rx="4" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="8" y="8" width="14" height="14" fill="#0B2EE6"/>
    <rect x="26" y="8" width="14" height="14" fill="#F25CF2"/>
    <rect x="44" y="8" width="14" height="14" fill="#8B3FE0"/>
    <rect x="62" y="8" width="14" height="14" fill="#00C27A"/>
    <rect x="8" y="26" width="14" height="14" fill="#8B3FE0"/>
    <rect x="26" y="26" width="14" height="14" fill="#0B2EE6"/>
    <rect x="44" y="26" width="14" height="14" fill="#FFD600"/>
    <rect x="62" y="26" width="14" height="14" fill="#F25CF2"/>
    <rect x="8" y="44" width="14" height="14" fill="#F25CF2"/>
    <rect x="26" y="44" width="14" height="14" fill="#00C27A"/>
    <rect x="44" y="44" width="14" height="14" fill="#0B2EE6"/>
    <rect x="62" y="44" width="14" height="14" fill="#8B3FE0"/>
  </g>

  <!-- Top-Right Abstract Sticker -->
  <g transform="translate(980, 100) rotate(8)">
    <rect width="110" height="110" rx="20" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <circle cx="55" cy="55" r="36" fill="#8B3FE0"/>
    <circle cx="55" cy="55" r="14" fill="#FFD600"/>
  </g>

  <!-- Thin Script Role -->
  <text x="360" y="210" font-family="cursive, Georgia" font-size="44" fill="#8B3FE0" transform="rotate(-4, 360, 210)">
    Creative Developer
  </text>

  <!-- Big Name -->
  <text x="600" y="330" text-anchor="middle" font-family="cursive, Impact, sans-serif" font-size="110" font-weight="bold" fill="#0A0A0A">
    Aaron Singh
  </text>

  <!-- Green Brush Underline -->
  <path d="M 380 355 Q 600 375 820 350" stroke="#00C27A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 400 365 Q 600 380 800 360" stroke="#00C27A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Spaced Serif Caps Role -->
  <text x="760" y="420" font-family="Georgia, serif" font-size="22" font-weight="600" letter-spacing="6" fill="#0B2EE6" transform="rotate(2, 760, 420)">
    PRODUCT BUILDER
  </text>

  <!-- Bottom Torn Card Tagline -->
  <g transform="translate(350, 490) rotate(-1)">
    <rect width="500" height="60" rx="4" fill="#FFFFFF" stroke="rgba(10,10,10,0.12)" stroke-width="1.5"/>
    <text x="250" y="38" text-anchor="middle" font-family="monospace" font-size="16" fill="#0A0A0A">
      Handcrafted portfolio &amp; playful digital experiences
    </text>
  </g>
</svg>

