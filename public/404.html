<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Lost in the Scrapbook</title>
    <style>
      :root {
        --color-paper: #F6F6F7;
        --color-ink: #0A0A0A;
        --color-cobalt: #0B2EE6;
        --color-magenta: #F25CF2;
        --color-grid-line: rgba(190, 70, 200, 0.28);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-paper);
        background-image: 
          linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: monospace;
        color: var(--color-ink);
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #FFFFFF;
        border: 2px solid var(--color-ink);
        box-shadow: 0 12px 28px rgba(10, 10, 10, 0.1);
        border-radius: 12px;
        padding: 40px;
        max-width: 440px;
        text-align: center;
        transform: rotate(-2deg);
      }
      h1 {
        font-size: 54px;
        margin: 0 0 12px;
        color: var(--color-cobalt);
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #555555;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: var(--color-cobalt);
        color: #FFFFFF;
        text-decoration: none;
        padding: 12px 24px;
        font-weight: bold;
        border-radius: 6px;
        box-shadow: 0 4px 12px rgba(11, 46, 230, 0.25);
        transition: transform 150ms ease;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>This pin seems to have fallen off the board. The page you are looking for does not exist.</p>
      <a href="/">← Return to The Board</a>
    </div>
  </body>
</html>
